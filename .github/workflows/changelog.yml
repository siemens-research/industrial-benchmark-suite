name: Update changelog

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Verify the tag is on the default branch
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: git merge-base --is-ancestor "$RELEASE_SHA" HEAD
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          version: "v2.14.2"
          config: cliff.toml
          args: --use-branch-tags --offline
        env:
          OUTPUT: CHANGELOG.md
      - name: Create changelog pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: CHANGELOG.md
          branch: automation/changelog
          commit-message: "docs(changelog): update release history"
          title: "docs(changelog): update release history"
          body: "Review the generated release history for accuracy and sensitive information before merging."
