[tool.poetry]
name = "Industrial Benchmark Suite"
version = "0.1.0"
description = "Collection of industrial benchmark environments."
authors = [
    "Marc Weber <marc-weber@siemens.com>",
    "Holger Schoener <holger.schoener@siemens.com>",
    "Daniel Hein <hein.daniel@siemens.com>",
]
license = "Siemens Inner Source License v1.4"
readme = "README.md"
homepage = "https://code.siemens.com/ai/industrial-benchmark-suite"
repository = "https://code.siemens.com/ai/industrial-benchmark-suite"
keywords = ["reinforcement-learning", "gym", "benchmark", "industrial-control", "timeseries"]

packages = [
    { include = "ibs" }
]

[tool.poetry.scripts]
gen_industry_benchmarks = "ibs.__main__:app"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
gymnasium = {version=">=0.26.1", extras=["classic-control"]}
matplotlib = "*"
numpy = "*"
pandas = "*"
pyarrow = "*"
pyyaml = ">=5.3"
scipy = "*"
tensorflow = ">2.20"  # avoid current runtime issue with pyarrow and tensorflow==2.20
tqdm = "*"
typer = "*"

[tool.poetry.group.dev.dependencies]
mypy = "*"
pre-commit = "*"
pre-commit-hooks = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "*"
mkdocs-jupyter = "*"
mkdocs-material = "*"
mkdocstrings = "*"
mkdocstrings-python-legacy = "*"
pymdown-extensions = "*"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "COM812", "D107", "ISC001"]

[tool.ruff.lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S101"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
parallel = true
source = ["ibs"]

[tool.coverage.paths]
source = ["ibs"]

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
