[project]
name = "industrial-benchmark-suite"
version = "1.0"
description = "Collection of industrial benchmark environments."
authors = [
    { name = "Marc Weber", email = "marc-weber@siemens.com" },
    { name = "Holger Schoener", email = "holger.schoener@siemens.com" },
    { name = "Daniel Hein", email = "hein.daniel@siemens.com" },
]
license = "MIT"
readme = "README.md"
keywords = ["reinforcement-learning", "gym", "benchmark", "industrial-control", "timeseries"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "gymnasium[classic-control]>=0.26.1",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml>=5.3",
    "scipy",
    "tensorflow>2.20",  # avoid current runtime issue with pyarrow and tensorflow==2.20
    "tqdm",
    "typer",
]

[project.urls]
homepage = "https://github.com/siemens/industrial-benchmark-suite"
repository = "https://github.com/siemens/industrial-benchmark-suite"

[project.scripts]
gen_industry_benchmarks = "ibs.__main__:app"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pre-commit-hooks",
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "mkdocs",
    "mkdocs-jupyter",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python-legacy",
    "pymdown-extensions",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ibs"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "COM812", "D107", "ISC001"]

[tool.ruff.lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S101"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
parallel = true
source = ["ibs"]

[tool.coverage.paths]
source = ["ibs"]

[tool.coverage.report]
show_missing = true

[tool.isort]
profile = "black"
