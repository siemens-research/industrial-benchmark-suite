stages:
  - test
#  - deploy

variables:
  http_proxy: $CODE_PROXY
  https_proxy: $CODE_PROXY
  no_proxy: $CODE_NO_PROXY
  UV_VERSION: "0.9"
  # Use the Python interpreter shipped in the image and never download a managed one.
  UV_PYTHON_DOWNLOADS: "never"
  UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
  # Copy instead of hardlink into the venv (hardlinks fail across CI cache volumes).
  UV_LINK_MODE: copy

