stages:
  - test

variables:
  http_proxy: $CODE_PROXY
  https_proxy: $CODE_PROXY
  no_proxy: $CODE_NO_PROXY
  UV_VERSION: "0.11.32"
  UV_PYTHON: python
  UV_PYTHON_DOWNLOADS: never

tests:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.11"
          - "3.12"
          - "3.13"
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-trixie
  script:
    - uv run --locked pytest --junitxml=.pytest-junit-report.xml --cov-report xml:coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: .pytest-junit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

pre-commit:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.11"
          - "3.12"
          - "3.13"
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-trixie
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
    RUFF_OUTPUT_FILE: .gitlab-code-quality-report.json
    RUFF_OUTPUT_FORMAT: gitlab
  before_script:
    - uv sync --locked --only-group dev
  script:
    - uv run --locked --only-group dev pre-commit run --all-files --show-diff-on-failure
  cache:
    key:
      prefix: pre-commit
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/pre-commit
  artifacts:
    reports:
      codequality: .gitlab-code-quality-report.json
