tests:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.11"
          - "3.12"
          - "3.13"
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-bookworm-slim
  before_script:
    - uv sync --locked
  script:
    - uv run pytest --junitxml=.pytest-junit-report.xml --cov-report xml:coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  cache:
    key:
      prefix: uv
      files:
        - uv.lock
    paths:
      - .cache/uv
  artifacts:
    when: always
    reports:
      junit: .pytest-junit-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

pre-commit:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.11"
          - "3.12"
          - "3.13"
  image: ghcr.io/astral-sh/uv:${UV_VERSION}-python${PYTHON_VERSION}-bookworm-slim
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.cache/pre-commit
    RUFF_OUTPUT_FILE: .gitlab-code-quality-report.json
    RUFF_OUTPUT_FORMAT: gitlab
  before_script:
    # pre-commit requires a git executable, which is not present in the uv slim image.
    - apt-get update && apt-get install -y --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - uv sync --locked
  script:
    - uv run pre-commit run --all-files --show-diff-on-failure
  cache:
    - key:
        prefix: uv
        files:
          - uv.lock
      paths:
        - .cache/uv
    - key:
        prefix: pre-commit
        files:
          - .pre-commit-config.yaml
      paths:
        - .cache/pre-commit
  artifacts:
    reports:
      codequality: .gitlab-code-quality-report.json

